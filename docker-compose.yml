services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: matcher
      POSTGRES_USER: matcher
      POSTGRES_PASSWORD: matcher
    ports: ["5433:5432"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/matcher
      SPRING_DATASOURCE_USERNAME: matcher
      SPRING_DATASOURCE_PASSWORD: matcher
    ports: ["8081:8080"]
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5174:80"]
    depends_on: [backend]
